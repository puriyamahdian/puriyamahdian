<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Pouria - Mechanical Engineering</title>
  <desc id="desc">A futuristic engineering banner with a cyan and violet gradient, technical grid, and mechanical-inspired geometry.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#08111f"/>
      <stop offset="55%" stop-color="#111a35"/>
      <stop offset="100%" stop-color="#24133d"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#e879f9"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#7dd3fc" stroke-opacity=".10" stroke-width="1"/>
    </pattern>
    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="300" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="22" fill="url(#grid)"/>
  <path d="M0 245H1200" stroke="url(#line)" stroke-opacity=".65" stroke-width="2"/>
  <path d="M0 252H440L490 202H710L760 252H1200" fill="none" stroke="url(#line)" stroke-opacity=".45" stroke-width="1.5"/>
  <g fill="none" stroke="url(#line)" stroke-width="2" opacity=".8">
    <circle cx="1000" cy="145" r="78"/>
    <circle cx="1000" cy="145" r="57" stroke-dasharray="8 8"/>
    <circle cx="1000" cy="145" r="27"/>
    <path d="M1000 49V75M1000 215V241M904 145H930M1070 145H1096M932 77L950 95M1050 195L1068 213M1068 77L1050 95M950 195L932 213"/>
    <path d="M1110 70L1150 30M1110 220L1150 260" opacity=".45"/>
  </g>
  <g fill="#67e8f9" opacity=".8" filter="url(#glow)">
    <circle cx="1000" cy="145" r="4"/>
    <circle cx="1120" cy="100" r="3"/>
    <circle cx="890" cy="210" r="3"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="72" y="115" fill="#94a3b8" font-size="18" letter-spacing="7">MECHANICAL ENGINEERING / PORTFOLIO</text>
    <text x="68" y="185" fill="#f8fafc" font-size="66" font-weight="800" letter-spacing="2">POURIA</text>
    <text x="73" y="222" fill="#67e8f9" font-size="20" font-weight="600" letter-spacing="5">DESIGN  •  ANALYZE  •  BUILD</text>
  </g>
  <path d="M72 240H420" stroke="url(#line)" stroke-width="3" filter="url(#glow)"/>
  <text x="1125" y="282" fill="#94a3b8" font-family="monospace" font-size="12" text-anchor="end">ENGINEERING / 01</text>
</svg>
